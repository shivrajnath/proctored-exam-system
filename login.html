<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Proctored Exam</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#172033;display:flex;align-items:center;justify-content:center}
.login-shell{width:min(420px,92%);background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:34px;box-shadow:0 18px 50px rgba(23,32,51,.10)}
.brand{text-align:center;margin-bottom:28px}
.brand-mark{width:48px;height:48px;margin:0 auto 14px;border-radius:12px;background:#17324d;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
h1{font-size:24px;margin:0 0 7px}.sub{margin:0;color:#6b7280;font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 7px}
.field{margin-bottom:18px}
input{width:100%;height:46px;border:1px solid #d8dee8;border-radius:9px;padding:0 13px;font-size:15px;outline:none}
input:focus{border-color:#1d5fa8;box-shadow:0 0 0 3px rgba(29,95,168,.10)}
button{width:100%;height:46px;border:0;border-radius:9px;background:#1d5fa8;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#174f8c}
.error{display:none;margin:14px 0 0;padding:11px;border-radius:8px;background:#fff0ef;color:#b42318;font-size:13px}
.demo{margin-top:20px;padding:12px;border-radius:9px;background:#f7f9fc;color:#667085;font-size:12px;line-height:1.6}
.demo strong{color:#344054}
</style>
</head>
<body>
<main class="login-shell">
  <div class="brand">
    <div class="brand-mark">PE</div>
    <h1>Student Login</h1>
    <p class="sub">Sign in to access your examinations</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="studentId">Student ID</label>
      <input id="studentId" name="studentId" autocomplete="username" placeholder="Enter student ID" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
    </div>
    <button type="submit">Sign in</button>
    <div id="error" class="error" role="alert"></div>
  </form>

  <div class="demo">
    Local development account<br>
    <strong>Student ID:</strong> student001<br>
    <strong>Password:</strong> 123456
  </div>
</main>

<script>
const form = document.getElementById("loginForm");
const error = document.getElementById("error");

if (localStorage.getItem("studentLoggedIn") === "true") {
  window.location.replace("dashboard.html");
}

form.addEventListener("submit", function (event) {
  event.preventDefault();

  const studentId = document.getElementById("studentId").value.trim();
  const password = document.getElementById("password").value;

  if (studentId === "student001" && password === "123456") {
    localStorage.setItem("studentLoggedIn", "true");
    localStorage.setItem("studentId", studentId);
    localStorage.setItem("studentName", "Student");
    window.location.replace("dashboard.html");
    return;
  }

  error.textContent = "Invalid Student ID or password.";
  error.style.display = "block";
});
</script>
</body>
</html>
